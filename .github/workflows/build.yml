name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      # ==========================================
      # 1. Setup Environment
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ==========================================
      # 2. Install Dependencies
      # ==========================================
      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install --save-dev adm-zip

      # ==========================================
      # 3. Setup FFmpeg
      # ==========================================
      - name: 🎬 Setup FFmpeg
        run: node scripts/setup-ffmpeg.js
        shell: cmd

      # ==========================================
      # 4. Build Application
      # ==========================================
      - name: 🏗️ Build Renderer (Vite)
        run: npm run build:renderer
        shell: cmd

      - name: 🔨 Build Electron App
        run: npm run build:electron
        shell: cmd
        env:
          # WAJIB: Token untuk publish ke GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # 5. Verify Build Output
      # ==========================================
      - name: 🔍 Check Build Output
        if: always()
        run: |
          echo "=========================================="
          echo "Current Directory:"
          cd
          echo.
          echo "=========================================="
          echo "Release Folder Contents:"
          dir release\ /s /b 2>nul || echo "Release folder not found"
          echo.
          echo "=========================================="
          echo "Searching for .exe files:"
          dir *.exe /s /b 2>nul || echo "No .exe found"
          echo.
          echo "=========================================="
          echo "File sizes:"
          for %f in (release\*.exe) do @echo %f - %~zf bytes
        shell: cmd

      # ==========================================
      # 6. Upload Artifact (Backup)
      # ==========================================
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe-build
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ==========================================
  # 7. Create GitHub Release
  # ==========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-build
          path: release/

      - name: 📋 List Downloaded Files
        run: |
          echo "Downloaded files:"
          ls -lah release/
          echo.
          echo "File details:"
          file release/*

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          fail_on_unmatched_files: false
          name: Anz Video Publisher ${{ github.ref_name }}
          body: |
            ## 🎬 Anz Video Publisher ${{ github.ref_name }}
            
            ### Downloads
            - **Installer**: `Anz Video Publisher Setup X.X.X.exe` - Full installation with shortcuts
            - **Portable**: `Anz Video Publisher X.X.X.exe` - Run without installation
            
            ### Features
            ✨ AI-powered viral clip detection
            🎨 Automatic caption generation
            🏷️ Smart hashtag suggestions
            📊 FYP score optimization
            💧 Watermark removal (AI inpainting)
            🚀 One-click publish to social media
            
            ### System Requirements
            - Windows 10/11 (64-bit)
            - 4GB RAM minimum (8GB recommended)
            - 500MB free disk space
            
            ### Installation
            1. Download the Setup file
            2. Run the installer
            3. Launch "Anz Video Publisher" from Start Menu or Desktop
            
            **Note**: FFmpeg is bundled automatically - no separate installation needed!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

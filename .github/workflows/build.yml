name: 🚀 Build & Publish (Electron Builder)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 🔥 INSTALL (AUTO FALLBACK)
      - name: 📦 Install Dependencies
        run: |
          if exist package-lock.json (
            npm ci
          ) else (
            npm install
          )
        shell: cmd

      # 🔥 FIX NATIVE MODULE (opencv dll)
      - name: 🧠 Rebuild Native Modules
        run: npm rebuild
        shell: cmd

      # 🔥 SETUP FFMPEG
      - name: 🎬 Setup FFmpeg
        run: node scripts/setup-ffmpeg.js || exit /b 1
        shell: cmd

      # 🔥 BUILD + AUTO UPLOAD KE GITHUB RELEASE
      - name: 🚀 Build & Publish
        run: npm run build:win
        shell: cmd

      # 🔍 DEBUG (optional tapi berguna)
      - name: 🔍 Check Output
        run: |
          echo === RELEASE ===
          dir release\ /s /b 2>nul || echo "No release folder"
        shell: cmd

name: 🚀 Build & Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install --save-dev adm-zip

      - name: 🎬 Setup FFmpeg
        run: node scripts/setup-ffmpeg.js
        shell: cmd

      - name: 🏗️ Build Vite (Renderer)
        run: npm run build:renderer
        shell: cmd

      - name: 🔨 Build Electron (Main)
        run: npm run build:electron
        shell: cmd

      # DEBUG: Cek folder release ada atau tidak
      - name: 🔍 Check Release Folder
        run: |
          echo "Current directory:"
          cd
          echo.
          echo "Listing release folder:"
          dir release\ /s /b 2>nul || echo "Release folder not found"
          echo.
          echo "Listing dist folder:"
          dir dist\ /s /b 2>nul || echo "Dist folder not found"
          echo.
          echo "Searching for .exe files:"
          dir *.exe /s /b 2>nul || echo "No .exe found"
        shell: cmd

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/**/*
            dist/*.exe
            *.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/

      - name: 📋 List Downloaded Files
        run: ls -la release/

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/**/*
          fail_on_unmatched_files: false
          name: Release ${{ github.ref_name }}
          draft: true  # Jadikan draft dulu biar bisa cek
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

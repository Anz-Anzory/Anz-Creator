name: 🚀 Build & Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Fix Node.js 20 deprecation warning

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Update to 20 (GitHub akan otomatis migrate ke 24 nanti)
          cache: 'npm'
          # Jangan cache jika tidak ada lock file
          cache-dependency-path: '**/package-lock.json'

      # FIX: Generate lock file jika tidak ada, lalu install
      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
            npm install --save-dev adm-zip tar
          fi
        shell: bash

      - name: 🎬 Setup FFmpeg
        run: |
          mkdir -p resources/ffmpeg/windows
          node scripts/setup-ffmpeg.js
        shell: bash

      - name: 🏗️ Build Application
        run: |
          npm run build:renderer
          npm run build:electron -- --publish=never
        shell: bash

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: warn

      - name: 📋 List Build Output
        run: |
          echo "Contents of release folder:"
          ls -la release/
        shell: bash

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/

      - name: 📋 Verify Download
        run: |
          echo "Downloaded files:"
          ls -la release/
        shell: bash

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.msi
            release/*.zip
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **Anz Video Publisher ${{ github.ref_name }}**
            
            ### Fitur:
            - 🤖 AI Video Analysis dengan Gemini
            - ✂️ Smart Video Splitter (1 jam → 30 short clips)
            - 🎨 Watermark Remover dengan AI Inpainting
            - 📝 Auto Caption & Hashtag Generator
            - 🎯 FYP Score Prediction
            
            ### System Requirements:
            - Windows 10/11 64-bit
            - 8GB RAM (minimal)
            - Koneksi internet untuk AI
            
            ### Cara Install:
            1. Download file `.exe` di bawah
            2. Jalankan installer
            3. Tunggu instalasi selesai
            4. Buka aplikasi dan masukkan API Key Gemini di Settings
            
            ### API Key:
            Dapatkan free API Key dari: https://aistudio.google.com/app/apikey
            
            ### Note:
            Aplikasi ini membutuhkan FFmpeg yang akan di-download otomatis saat pertama kali running.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

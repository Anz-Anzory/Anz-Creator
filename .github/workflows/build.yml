name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔧 Install adm-zip
        run: npm install --save-dev adm-zip

      - name: 🎬 Setup FFmpeg
        run: |
          mkdir -p resources/ffmpeg/windows
          npm run setup:ffmpeg:win
        shell: bash

      - name: 🏗️ Build Application
        run: |
          npm run build:renderer
          npm run build:electron -- --publish=never

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **Anz Video Publisher ${{ github.ref_name }}**
            
            ### Fitur:
            - 🤖 AI Video Analysis dengan Gemini
            - ✂️ Smart Video Splitter 
            - 🎨 Watermark Remover
            - 📝 Auto Caption & Hashtag
            - 🎯 FYP Score Prediction
            
            ### Cara Install:
            1. Download `.exe` di bawah
            2. Install dan jalankan
            3. Masukkan API Key Gemini di Settings
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

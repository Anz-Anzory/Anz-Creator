name: 🚀 Build & Release PRO MAX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CI: true

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 📦 Install
        run: npm ci

      - name: 🎬 Setup FFmpeg
        run: node scripts/setup-ffmpeg.js || exit /b 1
        shell: cmd

      - name: 🏗️ Build Renderer
        run: npm run build:renderer
        shell: cmd

      - name: 🔨 Build Electron
        run: npm run build:electron
        shell: cmd

      # 🔥 AUTO DETECT VERSION
      - name: 🧠 Get Version
        id: version
        run: |
          echo VERSION=%GITHUB_REF_NAME% >> %GITHUB_ENV%
        shell: cmd

      # 🔥 AUTO RENAME EXE
      - name: 📦 Rename EXE
        run: |
          for /r %%i in (*.exe) do (
            echo Found: %%i
            copy "%%i" "App-Setup-%VERSION%.exe"
          )
        shell: cmd

      # 🔥 GENERATE CHANGELOG OTOMATIS
      - name: 📝 Generate Changelog
        id: changelog
        run: |
          git log -10 --pretty=format:"- %%s" > CHANGELOG.txt
        shell: cmd

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            App-Setup-*.exe
            CHANGELOG.txt
            dist/**/*
            release/**/*
            out/**/*
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: release/

      - name: 📋 Check Files
        run: ls -R release/

      # 🔥 READ CHANGELOG
      - name: 📖 Read Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat release/CHANGELOG.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 🚀 CREATE RELEASE SUPER RAPI
      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          name: 🚀 Release ${{ github.ref_name }}
          body: |
            ## 🔥 What's New
            ${{ env.CHANGELOG }}

            ---
            ✅ Auto build by GitHub Actions  
            ⚡ Version: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

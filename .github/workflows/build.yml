name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # Langsung windows, tidak perlu matrix
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # DISABLE CACHE - tidak perlu lock file
          cache: 'npm'
          cache-dependency-path: '**/package.json'  # Use package.json instead

      - name: 📦 Install Dependencies
        run: |
          npm install
          npm install --save-dev adm-zip tar concurrently wait-on
        shell: cmd

      - name: 🎬 Setup FFmpeg
        run: node scripts/setup-ffmpeg.js
        shell: cmd

      - name: 🏗️ Build Application
        run: |
          npm run build:renderer
          npm run build:electron -- --publish=never
        shell: cmd

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.msi
            release/**/*.exe
          if-no-files-found: error

      - name: 📋 List Build Output
        run: dir release\ /s
        shell: cmd

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/

      - name: 📋 Verify Download
        run: ls -la release/

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/**/*.exe
          name: Release ${{ github.ref_name }}
          body: |
            🎉 **Anz Video Publisher ${{ github.ref_name }}**
            
            ### Fitur:
            - 🤖 AI Video Analysis dengan Gemini
            - ✂️ Smart Video Splitter
            - 🎨 Watermark Remover
            
            ### Download & Install:
            1. Download `.exe` file di bawah
            2. Install dan jalankan
            3. Masukkan API Key Gemini di Settings
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

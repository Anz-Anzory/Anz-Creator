name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      CI: true

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⚡ Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 📦 Install Dependencies
        run: |
          npm ci
          npm install --save-dev adm-zip

      - name: 🎬 Setup FFmpeg
        run: |
          node scripts/setup-ffmpeg.js || exit /b 1
        shell: cmd

      - name: 🏗️ Build Vite (Renderer)
        run: npm run build:renderer
        shell: cmd

      - name: 🔨 Build Electron (Main)
        run: npm run build:electron
        shell: cmd

      - name: 🔍 Debug Build Output
        run: |
          echo Current directory:
          echo %cd%
          echo.
          echo === RELEASE FOLDER ===
          dir release\ /s /b 2>nul || echo "No release folder"
          echo.
          echo === DIST FOLDER ===
          dir dist\ /s /b 2>nul || echo "No dist folder"
          echo.
          echo === OUT FOLDER ===
          dir out\ /s /b 2>nul || echo "No out folder"
          echo.
          echo === EXE FILES ===
          dir *.exe /s /b 2>nul || echo "No exe found"
        shell: cmd

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/**/*
            dist/**/*
            out/**/*
            *.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/

      - name: 📋 List Downloaded Files
        run: ls -R release/

      - name: 📝 Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        with:
          files: release/**/*
          fail_on_unmatched_files: true
          name: 🚀 Release ${{ github.ref_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 🚀 Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      # ==========================================
      # Checkout & Setup
      # ==========================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ==========================================
      # Dependencies
      # ==========================================
      - name: 📦 Install Dependencies
        run: |
          npm install
        shell: cmd

      - name: 📦 Install adm-zip
        run: npm install --save-dev adm-zip
        shell: cmd

      # ==========================================
      # FFmpeg Setup (with retry)
      # ==========================================
      - name: 🎬 Setup FFmpeg
        id: ffmpeg
        run: node scripts/setup-ffmpeg.js
        shell: cmd
        continue-on-error: true

      - name: 🎬 Retry FFmpeg Setup (if failed)
        if: steps.ffmpeg.outcome == 'failure'
        run: |
          echo "Retrying FFmpeg setup..."
          rmdir /s /q "%TEMP%\ffmpeg-setup" 2>nul
          node scripts/setup-ffmpeg.js
        shell: cmd

      # ==========================================
      # Build
      # ==========================================
      - name: 🏗️ Build Renderer (Vite)
        run: npm run build:renderer
        shell: cmd

      - name: 🔨 Build Electron
        run: npm run build:electron
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Verify Output
      # ==========================================
      - name: 🔍 Verify Build Output
        run: |
          echo "=========================================="
          echo "Checking release folder..."
          dir release\ /s /b 2>nul || echo "No release folder"
          echo.
          echo "Checking for .exe files..."
          where /r release *.exe 2>nul || echo "No .exe found"
        shell: cmd

      # ==========================================
      # Upload Artifact (if no tag)
      # ==========================================
      - name: 📤 Upload Artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: anz-video-publisher-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error

      # ==========================================
      # Create Release (tag push only)
      # ==========================================
      - name: 📝 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.exe
            release/*.blockmap
          fail_on_unmatched_files: false
          name: Anz Video Publisher ${{ github.ref_name }}
          body: |
            ## 🎬 Release ${{ github.ref_name }}
            
            ### Files
            - **Setup**: `Anz Video Publisher Setup *.exe` (Installer)
            - **Portable**: `Anz Video Publisher *.exe` (No install)
            
            ### Requirements
            - Windows 10/11 x64
            - 4GB RAM (8GB recommended)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

appId: com.anzory.video-publisher
productName: Anz Video Publisher
copyright: Copyright © 2024 Anzory

directories:
  output: release
  buildResources: resources

files:
  - main.js
  - preload.js
  - dist/**/*
  - src/services/**/*
  - src/main/**/*
  - resources/ffmpeg/**/*
  - package.json

extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - "**/*"
      - "!*.zip"
      - "!*.tar.xz"
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - resources/ffmpeg/**/

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  publisherName: Anzory
  verifyUpdateCodeSignature: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: resources/icon.png
  category: AudioVideo
  maintainer: Anzory
  vendor: Anzory
  synopsis: AI Video Publisher
  description: AI-powered video generator for social media

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Anz Video Publisher
  include: resources/installer.nsh

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

